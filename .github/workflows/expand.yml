# Keeps the watch list growing. Employers open their internship boards at
# different times of year, so this re-probes candidates that had nothing last
# month and onboards whichever ones now have a readable job board.
name: gary - discover employers

on:
  schedule:
    # Twice a day: the public feeds refresh daily, and employers open their
    # internship boards at different times of year.
    - cron: "40 6,18 * * *"
  workflow_dispatch:
    inputs:
      retry_all:
        description: "Re-probe every candidate, ignoring the retry window"
        type: boolean
        default: false

concurrency:
  group: gary-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Harvest new candidate employers from public feeds
        run: python -m watcher.harvest

      - name: Verify and onboard the ones with a real job board
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event.inputs.retry_all }}" = "true" ]; then
            python -m watcher.expand --retry-all
          else
            python -m watcher.expand
          fi

      # Absorb each new employer's existing backlog quietly, so onboarding
      # hundreds of them never turns into hundreds of texts.
      - name: Seed the new companies so they don't all fire at once
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m watcher.agent run --tier core --no-browser --quiet-new-companies
          for shard in 0 1 2 3 4 5 6 7; do
            python -m watcher.agent run --tier wide --no-browser \
              --shard "$shard/8" --quiet-new-companies || true
          done

      - name: Commit the updated list
        run: |
          if [ -z "$(git status --porcelain -- config.json candidates.json state/)" ]; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name  "Gary"
          git config user.email "actions@github.com"
          git add state/
          git commit -m "state: $(date -u +'%Y-%m-%d %H:%M UTC')"
          for attempt in 1 2 3 4 5; do
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            # Someone else pushed first. A rebase cannot merge JSON, so combine
            # the two state files explicitly and try again -- every field is
            # additive, so the union is the correct answer.
            git fetch -q origin "${GITHUB_REF_NAME}"
            git show "origin/${GITHUB_REF_NAME}:state/seen.json" > /tmp/theirs.json 2>/dev/null || echo '{}' > /tmp/theirs.json
            cp state/seen.json /tmp/ours.json
            git reset -q --hard "origin/${GITHUB_REF_NAME}"
            python -m watcher.merge_state /tmp/ours.json /tmp/theirs.json --out state/seen.json
            git add state/
            git commit -q -m "state: merged $(date -u +'%Y-%m-%d %H:%M UTC')" || true
            sleep $((attempt * 3))
          done
          echo "Could not push state after 5 attempts" >&2
          exit 1
