# Keeps the watch list growing. Employers open their internship boards at
# different times of year, so this re-probes candidates that had nothing last
# month and onboards whichever ones now have a readable job board.
name: gary - expand company list

on:
  schedule:
    - cron: "40 6 * * *"
  workflow_dispatch:
    inputs:
      retry_all:
        description: "Re-probe every candidate, ignoring the retry window"
        type: boolean
        default: false

concurrency:
  group: gary-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Look for employers we aren't watching yet
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event.inputs.retry_all }}" = "true" ]; then
            python -m watcher.expand --retry-all
          else
            python -m watcher.expand
          fi

      - name: Seed the new companies so they don't all fire at once
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m watcher.agent run --no-browser

      - name: Commit the updated list
        run: |
          if [ -z "$(git status --porcelain -- config.json state/)" ]; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name  "Gary"
          git config user.email "actions@github.com"
          git add config.json state/
          git commit -m "expand: refresh watched companies $(date -u +'%Y-%m-%d')"
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" \
              && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 4))
          done
          exit 1
