# Reusable: run the agent, then commit the state file it updated.
# Every caller shares one concurrency group so two runs can't race on state.
name: gary (reusable)

on:
  workflow_call:
    inputs:
      args:
        description: "Arguments passed to watcher.agent"
        required: true
        type: string
      install_browser:
        description: "Install Chromium for the browser lane"
        required: false
        default: false
        type: boolean
      timeout:
        required: false
        default: 20
        type: number
    secrets:
      TELEGRAM_BOT_TOKEN:
        required: true
      TELEGRAM_CHAT_ID:
        required: true

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout }}
    concurrency:
      group: gary-state
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Playwright browser
        if: ${{ inputs.install_browser }}
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements-browser.txt') }}

      - name: Install Playwright
        if: ${{ inputs.install_browser }}
        run: |
          python -m pip install --quiet -r requirements-browser.txt
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            python -m playwright install-deps chromium
          else
            python -m playwright install --with-deps chromium
          fi

      - name: Check the career sites
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m watcher.agent run ${{ inputs.args }}

      - name: Remember what we've already seen
        run: |
          # --porcelain also reports files that are still untracked, which is
          # the case on the very first run.
          if [ -z "$(git status --porcelain -- state/)" ]; then
            echo "No state change; nothing to commit."
            exit 0
          fi
          git config user.name  "Gary"
          git config user.email "actions@github.com"
          git add state/
          git commit -m "state: $(date -u +'%Y-%m-%d %H:%M UTC')"
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" \
              && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "push attempt $attempt lost a race; retrying"
            sleep $((attempt * 4))
          done
          echo "Could not push state after 5 attempts" >&2
          exit 1
